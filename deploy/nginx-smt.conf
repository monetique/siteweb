# ---------------------------------------------------------------------------
# Site public Monétique Tunisie — Nginx (site statique Next.js + formulaire contact)
# Le CMS Strapi reste sur le réseau interne : SEUL « POST /api/messages-contact » lui est relayé.
# Remplacer __ROOT__, __STRAPI__ et le nom de domaine avant mise en production.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=smt_contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=smt_site:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=smt_conn:10m;
map $request_method $smt_not_post { default 1; POST 0; }

server {
    listen 8080;                       # en production : listen 443 ssl http2; + certificats
    server_name _;
    root __ROOT__;                     # production : /var/www/smt/current (lien mis à jour par deploy/builder)
    index index.html;

    server_tokens off;
    autoindex off;
    client_max_body_size 32k;          # le site public ne reçoit que le formulaire de contact
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn smt_conn 30;
    limit_req zone=smt_site burst=200 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # --- En-têtes de sécurité ---------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # actif une fois HTTPS en place

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # Méthodes autorisées sur le site statique
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    # Fichiers cachés, sauvegardes, sources : jamais servis
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(map|bak|old|orig|swp|env|log|sql|ts|tsx|md)$ { return 404; }

    # --- Formulaire de contact → Strapi (interne) -------------------------
    location = /api/messages-contact {
        if ($smt_not_post) { return 405; }
        limit_req zone=smt_contact burst=3 nodelay;
        proxy_pass http://__STRAPI__/api/messages-contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # pas de concaténation : l'IP ne peut pas être usurpée
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    # Tout le reste de Strapi est inaccessible depuis Internet
    location ~ ^/(api|admin|upload|content-manager|content-type-builder|users-permissions|i18n|graphql|_health|documentation)(/|$) { return 404; }

    # --- Statique ---------------------------------------------------------
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /uploads/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        location ~* \.(php|phtml|html?|svg|js|xml)$ { return 404; }   # aucun contenu actif servi depuis /uploads
        try_files $uri =404;
    }
    location / {
        if ($request_method = POST) { return 405; }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
